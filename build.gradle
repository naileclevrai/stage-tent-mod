plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            forge_version    : forge_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Dev only: dump tent meshes for offline previews (./gradlew dumpMeshes -PdumpDir=...).
tasks.register('dumpMeshes', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.nailec.stagetents.client.MeshDump'
    args = [project.findProperty('dumpDir') ?: "${buildDir}/meshdump"]
}

// Dev only: mesh performance bench (./gradlew benchMeshes).
tasks.register('benchMeshes', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.nailec.stagetents.client.MeshBench'
}

// Dev only: dump the showcase tents used for the README images (./gradlew dumpScene -PdumpDir=...).
tasks.register('dumpScene', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.nailec.stagetents.client.SceneDump'
    args = [project.findProperty('dumpDir') ?: "${buildDir}/scenedump"]
}
